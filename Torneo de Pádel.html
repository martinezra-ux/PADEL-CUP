<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Torneo de Pádel</title>
<style>
:root{--bg:#f4f7ef;--card:#fff;--tx:#14231a;--mu:#5c6b60;--ac:#c6f135;--dk:#0f3d2a;--bd:#d9e2d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a13;--card:#142a1f;--tx:#eef5e6;--mu:#9db3a3;--bd:#24412f;--dk:#c6f135}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px;text-align:center}
h1{font-size:clamp(28px,7vw,44px);margin:8px 0 4px;letter-spacing:-.02em}
p.sub{color:var(--mu);margin:0 0 24px}
.ball{font-size:44px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}
.count div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 4px}
.count b{display:block;font-size:clamp(28px,9vw,48px);font-variant-numeric:tabular-nums}
.count span{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:14px 28px;background:var(--ac);color:#0f3d2a;cursor:pointer}
button.sec{background:transparent;border:1px solid var(--bd);color:var(--mu);font-weight:500;padding:8px 16px;font-size:13px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0}
.pl{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:var(--dk);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:24px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.pl b{font-size:14px}
.pair{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 0;animation:in .5s both}
.pair .n{font-size:12px;color:var(--mu);width:60px;text-align:left}
.pair .pl{border:0;padding:0;background:none;flex:1}
.pair .av{width:52px;height:52px;font-size:20px}
.pair .x{font-weight:800;color:var(--mu)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bracket{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center;text-align:left;margin:20px 0;overflow-x:auto}
.col{display:flex;flex-direction:column;gap:18px;justify-content:space-around;min-width:0}
.col h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);text-align:center}
.m{display:flex;flex-direction:column;gap:6px}
.t{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px 8px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px;text-align:center}
.t.w{border-color:var(--ac);background:var(--dk);color:var(--bg)}
.t.e{opacity:.5;cursor:default;font-weight:400}
.champ{font-size:22px;font-weight:800;margin:12px 0}
.hint{color:var(--mu);font-size:13px}
.hide{display:none}
:root:not([data-theme="light"]){--bg:#07261a;--card:rgba(255,255,255,.06);--tx:#f2f8e8;--mu:#9fc0aa;--bd:rgba(198,241,53,.22);--dk:#c6f135}
body{background:radial-gradient(900px 500px at 50% -10%,#14583b 0,transparent 70%),linear-gradient(#07261a,#04170f) fixed;color:var(--tx)}
body::before{content:"";position:fixed;inset:14px;border:2px solid rgba(198,241,53,.12);border-radius:18px;pointer-events:none}
body::after{content:"";position:fixed;left:50%;top:14px;bottom:14px;width:2px;background:rgba(198,241,53,.08);pointer-events:none}
main{position:relative;z-index:1;padding-top:36px}
.logo{width:120px;height:120px;filter:drop-shadow(0 8px 24px rgba(198,241,53,.35))}
.kicker{font-size:12px;letter-spacing:.28em;color:#c6f135;margin-top:10px;font-weight:700}
h1{font-size:clamp(38px,11vw,68px);font-weight:900;letter-spacing:.04em;margin:4px 0 6px;color:#fff}
h1 span{background:linear-gradient(90deg,#e6ff7a,#9ccc10);-webkit-background-clip:text;background-clip:text;color:transparent}
.count div,.pair,.pl,.t{background:var(--card);backdrop-filter:blur(6px);border-color:var(--bd)}
.count div{border-radius:16px;box-shadow:0 0 24px rgba(198,241,53,.08)}
.count b{color:#c6f135;text-shadow:0 0 18px rgba(198,241,53,.45)}
button:not(.sec){background:linear-gradient(135deg,#e6ff7a,#b4e61d);color:#0b3a27;box-shadow:0 8px 24px rgba(198,241,53,.3);font-size:16px}
button:not(.sec):active{transform:scale(.97)}
.t.w{background:linear-gradient(135deg,#e6ff7a,#b4e61d);color:#0b3a27;border-color:#c6f135}
.pair{border-radius:18px}
.champ{color:#c6f135;text-shadow:0 0 18px rgba(198,241,53,.4)}
</style>
</head>
<body>
<main>
<svg class="logo" viewBox="0 0 120 120" role="img" aria-label="Torneo de Pádel"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6ff7a"/><stop offset="1" stop-color="#9ccc10"/></linearGradient></defs><circle cx="60" cy="60" r="56" fill="#0b3a27" stroke="url(#g)" stroke-width="3"/><circle cx="60" cy="60" r="49" fill="none" stroke="#c6f135" stroke-opacity=".25" stroke-dasharray="2 5"/><g transform="rotate(-32 60 60)"><rect x="55.5" y="74" width="9" height="26" rx="4" fill="url(#g)"/><ellipse cx="60" cy="48" rx="22" ry="27" fill="#0f4a33" stroke="url(#g)" stroke-width="5"/><g fill="#c6f135"><circle cx="52" cy="34" r="2.4"/><circle cx="60" cy="34" r="2.4"/><circle cx="68" cy="34" r="2.4"/><circle cx="50" cy="43" r="2.4"/><circle cx="60" cy="43" r="2.4"/><circle cx="70" cy="43" r="2.4"/><circle cx="50" cy="52" r="2.4"/><circle cx="60" cy="52" r="2.4"/><circle cx="70" cy="52" r="2.4"/><circle cx="54" cy="61" r="2.4"/><circle cx="66" cy="61" r="2.4"/></g></g><circle cx="88" cy="88" r="13" fill="#d9ff3f" stroke="#0b3a27" stroke-width="2"/><path d="M77 83c7 2 11 8 12 16M99 80c-7 1-12 6-14 14" fill="none" stroke="#0b3a27" stroke-width="1.8" stroke-linecap="round"/></svg>
<div class="kicker">TORNEO · DICIEMBRE 2026</div>
<h1>PÁDEL <span>CUP</span></h1>
<p class="sub">8 jugadores · 4 parejas aleatorias · 1 campeón</p>

<section id="wait" class="hide">
  <p class="sub">El torneo se abre el 23 de diciembre</p>
  <div class="count">
    <div><b id="d">0</b><span>días</span></div>
    <div><b id="h">0</b><span>horas</span></div>
    <div><b id="m">0</b><span>min</span></div>
    <div><b id="s">0</b><span>seg</span></div>
  </div>
  <p class="hint">Vuelve cuando termine la cuenta atrás 👀</p>
</section>

<section id="draw" class="hide">
  <div class="players" id="plist"></div>
  <button id="go">🎲 Sortear parejas</button>
  <div id="pairs"></div>
  <div id="tobr" class="hide" style="margin-top:16px"><button id="br">Pasar a modo cuadro →</button></div>
</section>

<section id="cuadro" class="hide">
  <div class="bracket">
    <div class="col"><h3>Semifinales</h3><div class="m" id="s1"></div><div class="m" id="s2"></div></div>
    <div class="col"><h3>Final</h3><div class="m" id="f"></div></div>
    <div class="col"><h3>Campeones</h3><div class="champ" id="ch">🏆 ?</div></div>
  </div>
  <p class="hint">Toca la pareja ganadora de cada partido para avanzarla.</p>
  <button class="sec" id="reset">Reiniciar sorteo</button>
</section>
</main>
<script>
var TARGET=new Date(2026,11,23,0,0,0);
// Cuando tengas las fotos, ponlas aquí: "MAYO":"data:image/..." o una ruta
var PHOTOS={};
var NAMES=["MAYO","MARC","ALBERTO","ANDRÉS","FRAN","RAFA","JORDI","SORPRESA"];
var KEY="torneo-padel-v1";
var st={pairs:null,mode:"draw",s1:null,s2:null,f:null};
function $(i){return document.getElementById(i)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function load(){try{var v=localStorage.getItem(KEY);if(v)st=JSON.parse(v)}catch(e){}}
function av(n){var p=PHOTOS[n];return '<div class="av">'+(p?'<img src="'+p+'" alt="'+n+'">':(n==="SORPRESA"?"?":n[0]))+'</div>'}
function pl(n){return '<div class="pl">'+av(n)+'<b>'+n+'</b></div>'}
function show(id){["wait","draw","cuadro"].forEach(function(x){$(x).classList.toggle("hide",x!==id)})}
function tick(){
  var ms=TARGET-new Date();
  if(ms<=0||location.hash==="#abrir"){clearInterval(iv);start();return}
  var s=Math.floor(ms/1000);
  $("d").textContent=Math.floor(s/86400);
  $("h").textContent=Math.floor(s%86400/3600);
  $("m").textContent=Math.floor(s%3600/60);
  $("s").textContent=s%60;
  show("wait");
}
var iv;
function start(){
  load();
  $("plist").innerHTML=NAMES.map(pl).join("");
  if(st.pairs){renderPairs(false);if(st.mode==="cuadro")renderBracket();else show("draw")}
  else show("draw");
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function renderPairs(anim){
  var box=$("pairs");box.innerHTML="";
  $("go").classList.add("hide");$("plist").classList.add("hide");
  st.pairs.forEach(function(p,i){
    var delay=anim?i*900:0;
    setTimeout(function(){
      var d=document.createElement("div");d.className="pair";
      d.innerHTML='<span class="n">Pareja '+(i+1)+'</span>'+pl(p[0])+'<span class="x">+</span>'+pl(p[1]);
      box.appendChild(d);
      if(i===3)$("tobr").classList.remove("hide");
    },delay);
  });
}
function nm(i){return st.pairs[i].join(" & ")}
function team(arr,i,key,pick){
  var w=st[key]===i;
  return '<div class="t'+(w?' w':'')+(arr===null?' e':'')+'" data-k="'+key+'" data-v="'+i+'">'+(arr===null?"…":nm(i))+'</div>';
}
function renderBracket(){
  show("cuadro");
  var a=[0,1],b=[2,3];
  $("s1").innerHTML=a.map(function(i){return team(1,i,"s1")}).join("");
  $("s2").innerHTML=b.map(function(i){return team(1,i,"s2")}).join("");
  var fin=[st.s1,st.s2];
  $("f").innerHTML=fin.map(function(i){return i===null?'<div class="t e">…</div>':team(1,i,"f")}).join("");
  $("ch").innerHTML=st.f===null?"🏆 ?":"🏆 "+nm(st.f);
}
document.addEventListener("click",function(e){
  var t=e.target.closest(".t");
  if(t&&!t.classList.contains("e")){
    var k=t.dataset.k,v=+t.dataset.v;
    st[k]=v;
    if(k!=="f")st.f=null;
    save();renderBracket();
  }
});
$("go").onclick=function(){
  var s=shuffle(NAMES);
  st.pairs=[[s[0],s[1]],[s[2],s[3]],[s[4],s[5]],[s[6],s[7]]];
  st.mode="draw";st.s1=st.s2=st.f=null;save();renderPairs(true);
};
$("br").onclick=function(){st.mode="cuadro";save();renderBracket()};
$("reset").onclick=function(){
  if(!confirm("¿Seguro que quieres borrar el sorteo y empezar de nuevo?"))return;
  st={pairs:null,mode:"draw",s1:null,s2:null,f:null};save();
  $("pairs").innerHTML="";$("tobr").classList.add("hide");$("go").classList.remove("hide");$("plist").classList.remove("hide");show("draw");
};
tick();iv=setInterval(tick,1000);
</script>
</body>
</html>
